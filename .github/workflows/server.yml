name: Server

# Тесты Worker и админки на каждый пуш и PR, которые их касаются. Пуш в master с зелёными
# тестами - миграции D1 и деплой на dnui-schedule.hsryata.com. fixtures/ - эталоны парсера
# админки, их правка тоже должна прогнать тесты.
on:
  push:
    branches: [master]
    paths: ['server/**', 'fixtures/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'fixtures/**', '.github/workflows/server.yml']
  workflow_dispatch:

# два деплоя не должны идти одновременно, а начатый - не обрываться на полпути миграции
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            server/admin/package-lock.json
      # postinstall ставит admin через `npm install` - в CI строго по lock-файлам
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix admin
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            server/admin/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix admin
      - name: Проверить секреты
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::нет секрета CLOUDFLARE_API_TOKEN - см. docs/release.md"
            exit 1
          fi
      # миграции идемпотентны: уже применённые wrangler пропускает
      - name: Миграции D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply dnui-schedule --remote
      - name: Деплой (админка собирается сама, см. [build] в wrangler.toml)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: npx wrangler deploy
