name: APK

on:
  push:
    branches: [master]
    tags: ['v*']
    # Правки только сервера APK не меняют - не плодим сборки master-N в R2.
    # На теги фильтр путей не действует: релиз собирается всегда.
    paths-ignore: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Тег v1.2 -> релиз 1.2. Пуш в master -> только R2 и артефакт прогона,
      # чтобы в списке тегов лежали одни настоящие версии.
      - name: Определить версию
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=master-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Достать ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::нет секрета KEYSTORE_BASE64 - см. docs/release.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Тесты и сборка
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew test assembleRelease \
            -PappVersionCode=$GITHUB_RUN_NUMBER \
            -PappVersionName=${{ steps.v.outputs.name }}
          mv app/build/outputs/apk/release/app-release.apk \
             dnui-schedule-${{ steps.v.outputs.name }}.apk

      - name: Артефакт прогона
        uses: actions/upload-artifact@v4
        with:
          name: dnui-schedule-${{ steps.v.outputs.name }}
          path: dnui-schedule-${{ steps.v.outputs.name }}.apk
          if-no-files-found: error

      - name: Релиз на GitHub
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dnui-schedule-${{ steps.v.outputs.name }}.apk
          fail_on_unmatched_files: true

      - name: Загрузка в Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 не принимает дополнительные чексуммы, которые aws-cli v2 шлёт по умолчанию
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          APK=dnui-schedule-${{ steps.v.outputs.name }}.apk
          DST="s3://${{ secrets.R2_BUCKET }}/dnui-app-release"
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          for key in "$APK" dnui-schedule-latest.apk; do
            aws s3 cp "$APK" "$DST/$key" \
              --endpoint-url "$ENDPOINT" \
              --content-type application/vnd.android.package-archive
          done
